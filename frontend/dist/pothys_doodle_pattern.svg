    <circle cx="23" cy="10" r="5" class="doodle doodle-fill"/>
    <circle cx="10" cy="18" r="5" class="doodle doodle-fill"/>
    <circle cx="18" cy="18" r="5" class="doodle doodle-fill"/>
    <circle cx="26" cy="18" r="5" class="doodle doodle-fill"/>
    <circle cx="14" cy="25" r="5" class="doodle doodle-fill"/>
    <circle cx="22" cy="25" r="5" class="doodle doodle-fill"/>
    <circle cx="18" cy="32" r="5" class="doodle doodle-fill"/>
    <!-- Vine stem -->
