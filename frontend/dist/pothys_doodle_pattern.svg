    <path d="M35 53 C35 43 30 35 35 35 C40 35 35 43 35 53 Z" class="doodle"/>
    <path d="M17 35 C27 35 35 30 35 35 C35 40 27 35 17 35 Z" class="doodle"/>
    <path d="M53 35 C43 35 35 30 35 35 C35 40 43 35 53 35 Z" class="doodle"/>
