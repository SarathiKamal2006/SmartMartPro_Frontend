    <rect x="-35" y="11" width="35" height="15" rx="3" class="doodle"/>
    <circle cx="-10" cy="18.5" r="1.8" class="doodle-dot"/>
    <circle cx="-25" cy="18.5" r="1.8" class="doodle-dot"/>
