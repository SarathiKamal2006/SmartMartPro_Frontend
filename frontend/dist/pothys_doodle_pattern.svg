  <g transform="translate(10, 310)">
    <!-- Florets -->
    <path d="M22 25 C14 25 10 18 15 12 C10 6 18 0 25 5 C30 0 40 4 38 12 C44 15 40 25 32 25 Z" class="doodle doodle-fill"/>
    <path d="M22 25 C14 25 10 18 15 12 C10 6 18 0 25 5 C30 0 40 4 38 12 C44 15 40 25 32 25 Z" class="doodle"/>
    <!-- Stalk -->
    <path d="M22 25 L20 40 C20 42 32 42 32 40 L30 25" class="doodle doodle-fill"/>
    <path d="M22 25 L20 40 C20 42 32 42 32 40 L30 25" class="doodle"/>
