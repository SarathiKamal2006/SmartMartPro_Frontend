<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none">
  <defs>
    <style>
      /* ─── Warm Sandal / Sandalwood Palette with High Quality Crisp Definition ─── */
      .doodle { stroke: #ba804e; stroke-width: 2.0; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: 0.32; }
      .doodle-fill { fill: #c49260; opacity: 0.10; }
      .doodle-dot { fill: #ba804e; opacity: 0.38; }
      .doodle-accent { stroke: #d97706; stroke-width: 2.0; opacity: 0.34; }
      @media (prefers-color-scheme: dark) {
        .doodle { stroke: #f59e0b; opacity: 0.24; stroke-width: 1.9; }
        .doodle-fill { fill: #fbbf24; opacity: 0.08; }
        .doodle-dot { fill: #f59e0b; opacity: 0.30; }
        .doodle-accent { stroke: #fbbf24; opacity: 0.26; }
      }
    </style>
  </defs>

  <!-- 🍓 Strawberry (Top Left) -->
  <g transform="translate(45, 30)">
    <!-- Body -->
    <path d="M25 15 C42 15 50 35 45 52 C40 68 28 78 25 80 C22 78 10 68 5 52 C0 35 8 15 25 15 Z" class="doodle doodle-fill"/>
    <path d="M25 15 C42 15 50 35 45 52 C40 68 28 78 25 80 C22 78 10 68 5 52 C0 35 8 15 25 15 Z" class="doodle"/>
    <!-- Stem & Calyx Leaves -->
    <path d="M25 15 C25 6 22 2 18 0" class="doodle"/>
    <path d="M25 15 C30 8 38 7 42 10 C36 15 31 16 25 15 Z" class="doodle doodle-fill"/>
    <path d="M25 15 C20 8 12 7 8 10 C14 15 19 16 25 15 Z" class="doodle doodle-fill"/>
    <path d="M25 15 C25 22 21 26 17 25 C20 20 22 17 25 15 Z" class="doodle"/>
    <path d="M25 15 C25 22 29 26 33 25 C30 20 28 17 25 15 Z" class="doodle"/>
    <!-- Seeds -->
    <circle cx="18" cy="30" r="1.4" class="doodle-dot"/>
    <circle cx="32" cy="30" r="1.4" class="doodle-dot"/>
    <circle cx="25" cy="38" r="1.4" class="doodle-dot"/>
    <circle cx="15" cy="48" r="1.4" class="doodle-dot"/>
    <circle cx="35" cy="48" r="1.4" class="doodle-dot"/>
    <circle cx="25" cy="56" r="1.4" class="doodle-dot"/>
    <circle cx="20" cy="66" r="1.4" class="doodle-dot"/>
    <circle cx="30" cy="66" r="1.4" class="doodle-dot"/>
  </g>

  <!-- 🍎 Apple with leaf (Top Center) -->
  <g transform="translate(145, 35)">
    <!-- Apple Body -->
    <path d="M28 14 C35 14 54 18 54 38 C54 62 38 72 28 72 C18 72 2 62 2 38 C2 18 21 14 28 14 Z" class="doodle doodle-fill"/>
    <path d="M28 14 C35 14 54 18 54 38 C54 62 38 72 28 72 C18 72 2 62 2 38 C2 18 21 14 28 14 Z" class="doodle"/>
    <path d="M23 15 C26 18 30 18 33 15" class="doodle"/>
    <!-- Stem -->
    <path d="M28 14 C28 4 33 0 38 0" class="doodle"/>
    <!-- Leaf -->
    <path d="M30 8 C38 4 48 6 50 12 C44 16 34 14 30 8 Z" class="doodle doodle-fill"/>
    <path d="M30 8 C38 4 48 6 50 12 C44 16 34 14 30 8 Z" class="doodle"/>
  </g>

  <!-- 🍅 Sliced Tomato (Top Right) -->
  <g transform="translate(245, 25)">
    <circle cx="35" cy="35" r="32" class="doodle doodle-fill"/>
