    <path d="M25 8 C25 0 23 0 20 0 C22 10 12 20 6 32 C0 44 4 56 14 62 C22 66 28 66 36 62 C46 56 50 44 44 32 C38 20 28 10 25 8 Z" class="doodle doodle-fill"/>
    <path d="M25 8 C25 0 23 0 20 0 C22 10 12 20 6 32 C0 44 4 56 14 62 C22 66 28 66 36 62 C46 56 50 44 44 32 C38 20 28 10 25 8 Z" class="doodle"/>
