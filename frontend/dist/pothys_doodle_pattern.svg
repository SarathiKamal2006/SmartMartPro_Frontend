  <g transform="translate(75, 235)">
    <path d="M22 10 C14 10 6 18 6 32 C6 48 14 54 22 54 C25 54 28 52 30 52 C32 52 35 54 38 54 C46 54 54 48 54 32 C54 18 46 10 38 10 Z" class="doodle doodle-fill"/>
    <path d="M22 10 C14 10 6 18 6 32 C6 48 14 54 22 54 C25 54 28 52 30 52 C32 52 35 54 38 54 C46 54 54 48 54 32 C54 18 46 10 38 10 Z" class="doodle"/>
