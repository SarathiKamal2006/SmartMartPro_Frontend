    <line x1="30" y1="6" x2="30" y2="26" class="doodle"/>
    <line x1="30" y1="34" x2="30" y2="54" class="doodle"/>
    <line x1="6" y1="30" x2="26" y2="30" class="doodle"/>
    <line x1="34" y1="30" x2="54" y2="30" class="doodle"/>
    <line x1="13" y1="13" x2="27" y2="27" class="doodle"/>
    <line x1="33" y1="33" x2="47" y2="47" class="doodle"/>
    <line x1="47" y1="13" x2="33" y2="27" class="doodle"/>
    <line x1="27" y1="33" x2="13" y2="47" class="doodle"/>
