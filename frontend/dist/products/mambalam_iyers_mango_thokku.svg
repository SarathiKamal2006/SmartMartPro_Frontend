<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#ffffff"/>
  <defs>
    <linearGradient id="miPickle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="50%" stop-color="#880e4f"/>
      <stop offset="100%" stop-color="#4a0007"/>
    </linearGradient>
  </defs>
  <!-- Red Ribbed Lid -->
  <rect x="140" y="45" width="120" height="45" rx="8" fill="#d32f2f" stroke="#b71c1c" stroke-width="2"/>
  <!-- Glass Jar Body -->
  <path d="M 140 95 L 260 95 L 265 330 Q 265 350 200 350 Q 135 350 135 330 Z" fill="url(#miPickle)"/>
  <!-- Mambalam Iyers Yellow Label -->
  <rect x="140" y="140" width="120" height="130" fill="#ffeb3b" stroke="#f57f17" stroke-width="2"/>
  <rect x="145" y="145" width="110" height="35" rx="4" fill="#c62828"/>
  <text x="200" y="162" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">Mambalam Iyers</text>
  <text x="200" y="174" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#fff176" text-anchor="middle">B-8 TRADITIONAL TASTE</text>
  <!-- Product Title -->
  <text x="200" y="200" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#1b5e20" text-anchor="middle">MANGO THOKKU</text>
  <!-- Pickle Artwork -->
  <path d="M 180 235 Q 200 220 220 235 L 215 250 L 185 250 Z" fill="#2e7d32"/>
  <text x="200" y="262" font-family="Brush Script MT, cursive, Arial" font-size="12" fill="#b71c1c" text-anchor="middle">Tastes Like Mother's Love</text>
  <!-- Weight -->
  <rect x="165" y="318" width="70" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
  <text x="200" y="332" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#333333" text-anchor="middle">200 gm</text>
</svg>
