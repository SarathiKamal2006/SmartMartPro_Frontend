<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#ffffff"/>
  <defs>
    <linearGradient id="muesliBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="50%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#002171"/>
    </linearGradient>
  </defs>
  <!-- Jar Lid -->
  <rect x="145" y="40" width="110" height="30" rx="6" fill="#0d47a1"/>
  <!-- Plastic Jar Body -->
  <path d="M 140 70 L 260 70 L 270 330 Q 270 350 200 350 Q 130 350 130 330 Z" fill="url(#muesliBlue)"/>
  <!-- Red Kwality Oval -->
  <ellipse cx="200" cy="110" rx="35" ry="14" fill="#c62828"/>
  <text x="200" y="115" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle">Kwality</text>
  <!-- Muesli Main Title -->
  <text x="200" y="160" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle">MUESLI</text>
  <text x="200" y="182" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#ffeb3b" text-anchor="middle">FRUIT &amp; NUT</text>
  <!-- 76% Fruit Nut Badge -->
  <circle cx="160" cy="225" r="20" fill="#ff6f00"/>
  <text x="160" y="222" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle">76%</text>
  <text x="160" y="233" font-family="Arial, sans-serif" font-weight="700" font-size="7" fill="#ffffff" text-anchor="middle">FRUITS/NUTS</text>
  <!-- Bowl of Muesli Graphic -->
  <ellipse cx="215" cy="250" rx="35" ry="18" fill="#ffb74d"/>
  <ellipse cx="215" cy="246" rx="32" ry="15" fill="#d7ccc8"/>
  <!-- Net Weight -->
  <rect x="165" y="318" width="70" height="20" rx="4" fill="#ffffff"/>
  <text x="200" y="332" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#0d47a1" text-anchor="middle">1 Kg</text>
</svg>
