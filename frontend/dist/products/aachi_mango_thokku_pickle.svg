<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#ffffff"/>
  <defs>
    <linearGradient id="pickleGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="40%" stop-color="#d32f2f"/>
      <stop offset="80%" stop-color="#880e4f"/>
      <stop offset="100%" stop-color="#4a0007"/>
    </linearGradient>
    <linearGradient id="aachiGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#fff176"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </linearGradient>
  </defs>
  <!-- Red Jar Lid -->
  <rect x="140" y="45" width="120" height="45" rx="10" fill="#c62828" stroke="#8e0000" stroke-width="3"/>
  <rect x="135" y="85" width="130" height="12" rx="4" fill="#d32f2f"/>
  <!-- Glass Jar Body -->
  <path d="M 140 97 Q 130 110 130 140 L 130 330 Q 130 350 150 355 L 250 355 Q 270 350 270 330 L 270 140 Q 270 110 260 97 Z" fill="url(#pickleGlass)"/>
  <!-- Glass Shine -->
  <path d="M 145 120 L 155 120 L 155 330 L 145 330 Z" fill="#ffffff" opacity="0.2"/>
  <!-- Label Background -->
  <rect x="135" y="160" width="130" height="120" rx="8" fill="url(#aachiGold)" stroke="#f57f17" stroke-width="2"/>
  <!-- Aachi Oval Logo -->
  <ellipse cx="200" cy="188" rx="40" ry="16" fill="#c62828"/>
  <text x="200" y="194" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">Aachi</text>
  <!-- Product Title -->
  <text x="200" y="222" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#1b5e20" text-anchor="middle">MANGO THOKKU</text>
  <text x="200" y="238" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#b71c1c" text-anchor="middle">PICKLE BOTTLE</text>
  <!-- Raw Mango Graphic -->
  <path d="M 185 262 Q 200 245 215 260 Q 210 275 190 270 Z" fill="#4caf50" stroke="#2e7d32" stroke-width="1.5"/>
  <!-- Net Weight -->
  <rect x="165" y="320" width="70" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
  <text x="200" y="334" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#333333" text-anchor="middle">200 gm</text>
</svg>
