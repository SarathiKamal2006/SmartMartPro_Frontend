<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#ffffff"/>
  <defs>
    <linearGradient id="harpicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="50%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
  </defs>
  <!-- Angled Cap -->
  <path d="M 170 40 L 220 20 L 240 60 L 190 80 Z" fill="#d32f2f"/>
  <!-- Curved Bottle Body -->
  <path d="M 175 75 Q 120 120 130 330 Q 130 350 200 350 Q 270 350 270 330 Q 280 120 225 75 Z" fill="url(#harpicGrad)"/>
  <!-- Brand Shield -->
  <path d="M 150 140 L 250 140 L 240 230 L 200 250 L 160 230 Z" fill="#ffffff"/>
  <text x="200" y="180" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="#d32f2f" text-anchor="middle">HARPIC</text>
  <text x="200" y="200" font-family="Arial, sans-serif" font-weight="800" font-size="12" fill="#0d47a1" text-anchor="middle">POWER PLUS</text>
  <text x="200" y="220" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#d32f2f" text-anchor="middle">10/10</text>
  <text x="200" y="290" font-family="Arial, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle">Original Blue</text>
  <text x="200" y="320" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#bbdefb" text-anchor="middle">Net Vol: 200 ml</text>
</svg>
