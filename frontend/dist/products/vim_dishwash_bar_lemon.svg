<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#ffffff"/>
  <defs>
    <linearGradient id="vimGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="50%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
  </defs>
  <!-- Main Bar Pack -->
  <rect x="60" y="80" width="280" height="240" rx="15" fill="url(#vimGreen)" stroke="#1b5e20" stroke-width="4"/>
  <!-- Lemon Slice Accent -->
  <circle cx="280" cy="140" r="45" fill="#fbc02d" stroke="#fff59d" stroke-width="4"/>
  <circle cx="280" cy="140" r="35" fill="#fff176"/>
  <!-- Oval Brand Banner -->
  <ellipse cx="180" cy="200" rx="85" ry="55" fill="#d32f2f" stroke="#ffeb3b" stroke-width="4"/>
  <text x="180" y="212" font-family="Arial, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">Vim</text>
  <text x="180" y="275" font-family="Arial, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle">DISHWASH BAR</text>
  <text x="180" y="295" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#ffeb3b" text-anchor="middle">Power of 100 Lemons | 250g</text>
</svg>
