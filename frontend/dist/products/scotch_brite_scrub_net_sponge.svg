<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#ffffff"/>
  <defs>
    <linearGradient id="spongeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
  </defs>
  <!-- Outer Pouch Packaging -->
  <rect x="80" y="60" width="240" height="280" rx="15" fill="#f5f5f5" stroke="#2e7d32" stroke-width="4"/>
  <!-- Top Banner -->
  <rect x="80" y="60" width="240" height="70" rx="10" fill="url(#spongeGrad)"/>
  <text x="200" y="105" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#ffeb3b" text-anchor="middle">Scotch-Brite</text>
  <!-- Sponge Graphic -->
  <rect x="120" y="150" width="160" height="120" rx="12" fill="#ff4081"/>
  <rect x="120" y="150" width="160" height="30" rx="6" fill="#00e676"/>
  <text x="200" y="300" font-family="Arial, sans-serif" font-weight="800" font-size="16" fill="#1b5e20" text-anchor="middle">SCRUB NET SPONGE</text>
  <text x="200" y="322" font-family="Arial, sans-serif" font-weight="700" font-size="12" fill="#616161" text-anchor="middle">Non-Scratch Cleaning | Pack of 1</text>
</svg>
