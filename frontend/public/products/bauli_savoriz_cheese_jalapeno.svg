<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#ffffff"/>
  <defs>
    <linearGradient id="bauliBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43a047"/>
      <stop offset="50%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
  </defs>
  <!-- Horizontal Snack Pillow Pouch -->
  <path d="M 60 140 Q 60 120 80 120 L 320 120 Q 340 120 340 140 L 340 260 Q 340 280 320 280 L 80 280 Q 60 280 60 260 Z" fill="url(#bauliBg)" stroke="#1b5e20" stroke-width="2"/>
  <!-- Left Crimped Edge -->
  <line x1="75" y1="120" x2="75" y2="280" stroke="#ffffff" stroke-width="3" stroke-dasharray="4,4"/>
  <!-- Right Crimped Edge -->
  <line x1="325" y1="120" x2="325" y2="280" stroke="#ffffff" stroke-width="3" stroke-dasharray="4,4"/>
  <!-- Bauli Script Logo -->
  <text x="140" y="165" font-family="Brush Script MT, cursive, Arial" font-weight="900" font-size="28" fill="#ffffff">Bauli</text>
  <text x="140" y="188" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#ffee58">SAVORIZ</text>
  <!-- Flavor Name -->
  <rect x="135" y="198" width="130" height="30" rx="4" fill="#c62828"/>
  <text x="200" y="218" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle">CHEESE JALAPENO</text>
  <!-- Croissant Graphic -->
  <path d="M 270 170 Q 300 190 290 220 Q 260 240 250 200 Z" fill="#ffb74d" stroke="#e65100" stroke-width="2"/>
  <!-- Net Weight -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">40 gm</text>
</svg>
