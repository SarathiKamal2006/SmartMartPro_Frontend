<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#ffffff"/>
  <defs>
    <linearGradient id="honeyAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb300"/>
      <stop offset="50%" stop-color="#ffa000"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>
  </defs>
  <!-- Twin Pack Shrink Wrap Line -->
  <rect x="100" y="115" width="200" height="15" fill="#e0e0e0" opacity="0.6"/>
  <!-- Left Bottle -->
  <g transform="translate(-40, 0)">
    <rect x="160" y="55" width="50" height="25" rx="6" fill="#fbc02d"/>
    <path d="M 150 80 Q 140 100 140 120 L 140 310 Q 140 330 185 330 Q 230 330 230 310 L 230 120 Q 230 100 220 80 Z" fill="url(#honeyAmber)" stroke="#e65100" stroke-width="1.5"/>
    <rect x="150" y="150" width="70" height="80" rx="6" fill="#fff59d" stroke="#fbc02d" stroke-width="1"/>
    <text x="185" y="172" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#b71c1c" text-anchor="middle">LION</text>
    <text x="185" y="188" font-family="Arial, sans-serif" font-weight="800" font-size="9" fill="#e65100" text-anchor="middle">KASHMIR</text>
    <text x="185" y="202" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ff6f00" text-anchor="middle">HONEY</text>
  </g>
  <!-- Right Bottle -->
  <g transform="translate(40, 0)">
    <rect x="160" y="55" width="50" height="25" rx="6" fill="#fbc02d"/>
    <path d="M 150 80 Q 140 100 140 120 L 140 310 Q 140 330 185 330 Q 230 330 230 310 L 230 120 Q 230 100 220 80 Z" fill="url(#honeyAmber)" stroke="#e65100" stroke-width="1.5"/>
    <rect x="150" y="150" width="70" height="80" rx="6" fill="#fff59d" stroke="#fbc02d" stroke-width="1"/>
    <text x="185" y="172" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#b71c1c" text-anchor="middle">LION</text>
    <text x="185" y="188" font-family="Arial, sans-serif" font-weight="800" font-size="9" fill="#e65100" text-anchor="middle">KASHMIR</text>
    <text x="185" y="202" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ff6f00" text-anchor="middle">HONEY</text>
  </g>
  <!-- Buy 1 Get 1 Badge -->
  <rect x="140" y="340" width="120" height="22" rx="4" fill="#fbc02d"/>
  <text x="200" y="355" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#b71c1c" text-anchor="middle">BUY 1 GET 1 FREE</text>
</svg>
