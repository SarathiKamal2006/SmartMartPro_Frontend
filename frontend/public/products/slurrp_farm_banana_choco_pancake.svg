<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#ffffff"/>
  <defs>
    <linearGradient id="slurrpYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b"/>
      <stop offset="50%" stop-color="#fdd835"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </linearGradient>
  </defs>
  <!-- Standup Pouch Body -->
  <path d="M 125 65 L 275 65 L 285 340 Q 285 355 200 355 Q 115 355 115 340 Z" fill="url(#slurrpYellow)" stroke="#f57f17" stroke-width="2"/>
  <!-- Slurrp Farm Logo -->
  <text x="200" y="100" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#2e7d32" text-anchor="middle">slurrp</text>
  <text x="200" y="118" font-family="Arial, sans-serif" font-weight="800" font-size="14" fill="#388e3c" text-anchor="middle">farm</text>
  <!-- Product Title Header -->
  <rect x="135" y="130" width="130" height="45" rx="8" fill="#5d4037"/>
  <text x="200" y="150" font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="#fff176" text-anchor="middle">Millet Pancake</text>
  <text x="200" y="166" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">BANANA CHOCO-CHIP</text>
  <!-- Pancake Stack Graphic -->
  <ellipse cx="200" cy="240" rx="45" ry="15" fill="#d7ccc8"/>
  <ellipse cx="200" cy="232" rx="43" ry="14" fill="#ffb74d"/>
  <ellipse cx="200" cy="224" rx="41" ry="13" fill="#ffa726"/>
  <!-- Butter Cube on Top -->
  <rect x="193" y="208" width="14" height="10" fill="#fff59d" stroke="#fbc02d"/>
  <!-- Tiger Mascot / Banana Graphic -->
  <path d="M 150 260 Q 140 280 160 285 Z" fill="#ffca28"/>
  <text x="200" y="310" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#4e342e" text-anchor="middle">No Maida • Multigrain</text>
  <!-- Weight -->
  <rect x="165" y="322" width="70" height="20" rx="4" fill="#2e7d32"/>
  <text x="200" y="336" font-family="Arial, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">150 gm</text>
</svg>
